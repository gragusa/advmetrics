project:
  type: website
  pre-render: scripts/check-materials.py
  render:
    - "*.qmd"
    - "updates/*.md"
    - "!slides/"
    - "!indexm.qmd"
  resources:
    - "files/"
    - "materials/"

# See https://quarto.org/docs/projects/code-execution.html#freeze
execute:
  freeze: auto  #  Re-render only when source changes

bibliography: files/bib/references.bib
csl: files/bib/chicago-author-date.csl
description-meta: "Advanced Econometrics - Giuseppe Ragusa - Sapienza"

website:
  title: "Advanced Econometrics"
  site-url: "https://gragusa.org/advmetrics/"
  site-path: "/advmetrics/"
  favicon: "/files/icon-512.png"
  navbar:
    title: "Advanced Econometrics"
    right:
      - text: "Updates"
        file: updates.qmd
      - text: "Assignments"
        file: assignments.qmd
      - text: "Notes"
        file: material.qmd
      - icon: rss
        href: updates.xml
        aria-label: "Course updates RSS feed"
  page-footer:
    left: "Giuseppe Ragusa · Sapienza University of Rome"
    right: "[gragusa.org](https://gragusa.org)"

format:
  academic-html:
    email-obfuscation: javascript
    # Course identity: the only two values that differ between course sites.
    include-in-header:
      text: |
        <style>:root { --course: #006c4d; --course-mark: "AE"; }</style>
